<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 공유 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        /* 피드 스크롤 스냅 */
        .feed-container {
            scroll-snap-type: y mandatory;
            height: calc(100vh - 112px); /* 헤더와 과목 선택 영역 높이를 제외 */
        }
        .feed-item {
            scroll-snap-align: start;
        }
        .animate-scale-up {
            animation: scaleUp 0.3s ease-out forwards;
        }
        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        /* 드래그 커서 스타일 */
        #subject-selector {
            cursor: grab;
            user-select: none; /* 드래그 시 텍스트 선택 방지 */
        }
        #subject-selector.grabbing {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- 로그인 컨테이너: 기본적으로 숨김 -->
    <div id="login-container" class="max-w-md mx-auto h-screen bg-white flex flex-col items-center justify-center p-8 text-center hidden">
        <h1 class="text-4xl font-bold text-blue-600 mb-4">Q-study</h1>
        <p class="text-gray-600 mb-10">학습 질문을 공유하고 함께 성장하세요.</p>
        <!-- Google 로그인 버튼은 Canvas 환경에서 필요 없음 -->
    </div>

    <!-- 앱 컨테이너: 기본적으로 표시 -->
    <div id="app-container" class="max-w-md mx-auto h-screen bg-white shadow-lg overflow-hidden flex flex-col">

        <header class="flex justify-between items-center p-4 border-b bg-white z-10">
            <h1 class="text-xl font-bold text-blue-600">Q-study</h1>
            <div id="profile-button" class="flex items-center space-x-2 cursor-pointer">
                <span id="user-id" class="font-semibold text-gray-700 truncate max-w-[100px]"></span>
                <img id="user-img" src="https://placehold.co/40x40/E2E8F0/4A5568?text=P" alt="프로필 사진" class="w-10 h-10 rounded-full">
            </div>
        </header>

        <nav class="bg-white border-b sticky top-0 z-10">
            <div id="subject-selector" class="flex space-x-4 p-3 overflow-x-auto no-scrollbar whitespace-nowrap">
                <!-- 과목 버튼은 JS로 렌더링 -->
            </div>
        </nav>

        <main id="feed" class="flex-1 overflow-y-auto feed-container bg-gray-50">
            <!-- 게시물은 JS로 렌더링 -->
        </main>
        
        <button id="create-post-btn" class="fixed bottom-6 right-1/2 translate-x-[calc(100%+1rem)] md:translate-x-[11rem] w-14 h-14 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg hover:bg-blue-700 transition-transform transform hover:scale-105">
            <i class="fa-solid fa-plus text-2xl"></i>
        </button>
    </div>

    <!-- 새 질문 모달 -->
    <div id="post-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative animate-scale-up">
            <button id="close-post-modal" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">
                <i class="fa-solid fa-times text-2xl"></i>
            </button>
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">새 질문 올리기</h2>
            <form id="post-form">
                <input type="text" id="post-title" placeholder="제목을 입력하세요" class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required>
                <textarea id="post-content" placeholder="궁금한 내용을 적어주세요..." class="w-full p-3 border border-gray-300 rounded-lg mb-4 h-40 resize-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required></textarea>
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
                        <label for="post-image" class="cursor-pointer text-blue-600 font-medium hover:text-blue-700">
                            <i class="fa-solid fa-camera mr-2"></i> 사진 첨부
                        </label>
                        <input type="file" id="post-image" class="hidden" accept="image/*">
                        <span id="image-preview" class="text-sm text-gray-500"></span>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg mt-6 hover:bg-blue-700 transition-colors">게시하기</button>
            </form>
        </div>
    </div>
    
    <!-- 프로필 모달 -->
    <div id="profile-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 relative text-center animate-scale-up">
             <button id="close-profile-modal" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">
                <i class="fa-solid fa-times text-2xl"></i>
            </button>
            <img id="profile-modal-img" src="https://placehold.co/80x80/E2E8F0/4A5568?text=P" alt="프로필 사진" class="w-20 h-20 rounded-full mx-auto mb-4 border-4 border-blue-500">
            <h2 id="profile-modal-userid" class="text-2xl font-bold text-gray-800"></h2>
            <p class="text-gray-500 mb-6">학습에 대한 열정이 가득!</p>
            <div class="flex justify-around bg-gray-100 p-4 rounded-lg">
                <div class="text-center">
                    <p class="text-2xl font-bold text-blue-600" id="total-hearts">0</p>
                    <p class="text-sm text-gray-600">총 하트</p>
                </div>
                <div class="text-center">
                    <p class="text-2xl font-bold text-blue-600" id="total-posts">0</p>
                    <p class="text-sm text-gray-600">게시물</p>
                </div>
                <div class="text-center">
                    <p class="text-2xl font-bold text-blue-600" id="total-comments">0</p>
                    <p class="text-sm text-gray-600">댓글</p>
                </div>
            </div>
            <button id="logout-btn" class="w-full bg-red-500 text-white font-bold py-2 px-4 rounded-lg mt-6 hover:bg-red-600 transition-colors">로그아웃</button>
        </div>
    </div>

    <!-- 댓글 모달 -->
    <div id="comment-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-0 relative animate-scale-up flex flex-col h-[80vh]">
            <div class="flex justify-between items-center p-4 border-b sticky top-0 bg-white rounded-t-2xl">
                <h2 class="text-xl font-bold text-gray-800">댓글</h2>
                <button id="close-comment-modal" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">
                    <i class="fa-solid fa-times text-2xl"></i>
                </button>
            </div>
            <div id="comment-list" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- 댓글은 JS로 렌더링 -->
            </div>
            <form id="comment-form" class="p-4 border-t bg-gray-50 flex items-center sticky bottom-0 bg-white rounded-b-2xl">
                <input type="hidden" id="comment-post-id">
                <input type="text" id="comment-input" placeholder="댓글을 입력하세요..." class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required>
                <button type="submit" class="ml-3 px-5 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- 오류 모달 -->
    <div id="error-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 relative text-center animate-scale-up">
            <div class="flex justify-center items-center mx-auto w-12 h-12 rounded-full bg-red-100 mb-4">
                 <i class="fa-solid fa-exclamation-triangle text-2xl text-red-600"></i>
            </div>
            <h2 class="text-xl font-bold mb-2 text-gray-800">오류 발생</h2>
            <p id="error-message" class="text-gray-600 mb-6"></p>
            <button id="close-error-modal" class="w-full bg-red-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-600 transition-colors">확인</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // (*** MODIFIED ***) - signInWithCustomToken, signInAnonymously 추가, GoogleAuthProvider, signInWithPopup 제거
        import { getAuth, onAuthStateChanged, signOut, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        document.addEventListener('DOMContentLoaded', () => {
            // --- (*** MODIFIED ***) Firebase 설정 (Canvas 환경 변수 사용) ---
            const firebaseConfig = typeof __firebase_config !== 'undefined' 
                ? JSON.parse(__firebase_config)
                : { apiKey: "FALLBACK_API_KEY", authDomain: "FALLBACK_AUTH_DOMAIN", projectId: "FALLBACK_PROJECT_ID" }; // 폴백
            
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            // Firebase 초기화
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            setLogLevel('debug'); // Firestore 디버그 로그 활성화

            // --- (*** NEW ***) Firestore 경로 ---
            const postsCollectionPath = `artifacts/${appId}/public/data/posts`;
            let currentUserId = null; // 현재 유저 ID
            
            // --- 데이터 ---
            const subjects = ['전체', '국어', '수학', '영어', '빅데이터', '과학', '사회', '코딩', '역사', '지리'];
            let posts = []; // Firestore에서 받아온 데이터를 저장할 배열
            let likedPosts = new Set(); // 현재 세션에서 '하트'를 누른 게시물 ID 저장
            
            // --- DOM 요소 ---
            // const loginContainer = document.getElementById('login-container'); // (*** REMOVED ***)
            const appContainer = document.getElementById('app-container');
            // const loginBtn = document.getElementById('login-btn'); // (*** REMOVED ***)
            const logoutBtn = document.getElementById('logout-btn');
            const subjectSelector = document.getElementById('subject-selector');
            const userIdSpan = document.getElementById('user-id');
            const userImg = document.getElementById('user-img');
            const profileModalUserId = document.getElementById('profile-modal-userid');
            const profileModalUserImg = document.getElementById('profile-modal-img');
            const feed = document.getElementById('feed');
            const createPostBtn = document.getElementById('create-post-btn');
            const postModal = document.getElementById('post-modal');
            const closePostModalBtn = document.getElementById('close-post-modal');
            const postForm = document.getElementById('post-form');
            const profileButton = document.getElementById('profile-button');
            const profileModal = document.getElementById('profile-modal');
            const closeProfileModalBtn = document.getElementById('close-profile-modal');
            const postImageInput = document.getElementById('post-image');
            const imagePreview = document.getElementById('image-preview');
            const errorModal = document.getElementById('error-modal');
            const errorMessage = document.getElementById('error-message');
            const closeErrorModalBtn = document.getElementById('close-error-modal');
            const totalHearts = document.getElementById('total-hearts');
            const totalPosts = document.getElementById('total-posts');
            const totalComments = document.getElementById('total-comments');

            // (*** NEW ***) 댓글 모달 DOM 요소
            const commentModal = document.getElementById('comment-modal');
            const closeCommentModalBtn = document.getElementById('close-comment-modal');
            const commentList = document.getElementById('comment-list');
            const commentForm = document.getElementById('comment-form');
            const commentPostIdInput = document.getElementById('comment-post-id');
            const commentInput = document.getElementById('comment-input');


            let activeSubject = '전체';
            
            // --- (*** MODIFIED ***) 앱 초기화 (로그인 성공 시 호출) ---
            function initializeAppUI(user) {
                // (*** NEW ***) 익명/커스텀 유저 프로필 정보 설정
                const displayName = user.displayName || `User-${user.uid.substring(0, 6)}`;
                const photoURL = user.photoURL || `https://placehold.co/40x40/E2E8F0/4A5568?text=${displayName[0]}`;

                userIdSpan.textContent = displayName;
                userImg.src = photoURL;
                renderSubjects();
                renderPosts();
            }

            // --- 과목 선택창 드래그 스크롤 기능 ---
            let isDown = false;
            let startX;
            let scrollLeft;

            if(subjectSelector) {
                subjectSelector.addEventListener('mousedown', (e) => {
                    isDown = true;
                    subjectSelector.classList.add('grabbing');
                    startX = e.pageX - subjectSelector.offsetLeft;
                    scrollLeft = subjectSelector.scrollLeft;
                });
                subjectSelector.addEventListener('mouseleave', () => { isDown = false; subjectSelector.classList.remove('grabbing'); });
                subjectSelector.addEventListener('mouseup', () => { isDown = false; subjectSelector.classList.remove('grabbing'); });
                subjectSelector.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - subjectSelector.offsetLeft;
                    const walk = (x - startX) * 1.5;
                    subjectSelector.scrollLeft = scrollLeft - walk;
                });
            }

            // --- 렌더링 함수 ---
            function renderSubjects() {
                subjectSelector.innerHTML = '';
                subjects.forEach(subject => {
                    const button = document.createElement('button');
                    button.textContent = subject;
                    button.className = `px-4 py-2 rounded-full text-sm font-semibold transition-colors flex-shrink-0 ${subject === activeSubject ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
                    button.onclick = () => {
                        const wasDragged = Math.abs(subjectSelector.scrollLeft - scrollLeft) > 5;
                        if(isDown && wasDragged) return;

                        activeSubject = subject;
                        renderSubjects();
                        renderPosts();
                    };
                    subjectSelector.appendChild(button);
                });
            }

            function renderPosts() {
                feed.innerHTML = '';
                const filteredPosts = activeSubject === '전체' ? posts : posts.filter(p => p.subject === activeSubject);
                
                if (filteredPosts.length === 0) {
                    feed.innerHTML = `<div class="text-center p-10 text-gray-500">게시물이 없습니다.<br>첫 질문을 등록해보세요!</div>`;
                    return;
                }

                filteredPosts.forEach(post => { // 순서는 DB에서 정렬하므로 reverse() 제거
                    const postElement = document.createElement('div');
                    postElement.className = 'feed-item h-full flex-shrink-0 bg-white border-b flex flex-col p-4';
                    
                    // 현재 사용자가 이 게시물에 하트를 눌렀는지 확인
                    const isLiked = likedPosts.has(post.id);

                    postElement.innerHTML = `
                        <div class="flex items-center mb-3">
                            <img src="${post.userImg}" alt="user" class="w-10 h-10 rounded-full mr-3">
                            <div>
                                <p class="font-bold text-gray-800">${post.user}</p>
                                <p class="text-xs text-gray-500">${post.subject}</p>
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto no-scrollbar">
                            <h3 class="text-lg font-bold mb-2 text-gray-900">${post.title}</h3>
                            <p class="text-gray-700 mb-4 whitespace-pre-wrap">${post.content}</p>
                            ${post.image ? `<img src="${post.image}" alt="post image" class="rounded-lg w-full object-cover mb-4">` : ''}
                        </div>
                        <div class="flex items-center space-x-6 pt-3 mt-auto">
                            <button class="flex items-center space-x-1 text-gray-600 hover:text-red-500 transition-colors" onclick="toggleHeart(this, '${post.id}')">
                                <i class="fa-${isLiked ? 'solid text-red-500' : 'regular'} fa-heart text-xl"></i>
                                <span class="font-semibold text-sm">${post.hearts}</span>
                            </button>
                            <button class="flex items-center space-x-1 text-gray-600 hover:text-blue-500 transition-colors" onclick="openComments('${post.id}')">
                                <i class="fa-regular fa-comment text-xl"></i>
                                <span class="font-semibold text-sm">${post.comments}</span>
                            </button>
                        </div>
                    `;
                    feed.appendChild(postElement);
                });
            }

            // --- (*** REMOVED ***) 로그인/로그아웃 함수 ---
            // handleLogin 제거
            const handleLogout = async () => {
                try {
                    await signOut(auth);
                } catch (error) {
                    console.error("로그아웃 오류:", error);
                }
            };

            // --- (*** NEW ***) 자동 인증 함수 ---
            async function authenticateUser() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (error) {
                    console.error("인증 오류:", error);
                    errorMessage.textContent = `인증에 실패했습니다: ${error.message}`;
                    errorModal.classList.remove('hidden');
                }
            }

            // --- 이벤트 리스너 ---
            // loginBtn.addEventListener('click', handleLogin); // (*** REMOVED ***)
            logoutBtn.addEventListener('click', handleLogout);
            createPostBtn.addEventListener('click', () => postModal.classList.remove('hidden'));
            closePostModalBtn.addEventListener('click', () => postModal.classList.add('hidden'));
            closeErrorModalBtn.addEventListener('click', () => errorModal.classList.add('hidden'));

            profileButton.addEventListener('click', () => {
                const currentUser = auth.currentUser;
                if (!currentUser) return;

                // (*** NEW ***) 익명 유저 처리
                const displayName = currentUser.displayName || `User-${currentUser.uid.substring(0, 6)}`;
                const photoURL = currentUser.photoURL || `https://placehold.co/80x80/E2E8F0/4A5568?text=${displayName[0]}`;

                // 실시간 데이터를 기반으로 통계 계산
                const myPosts = posts.filter(p => p.userId === currentUser.uid);
                const totalMyPosts = myPosts.length;
                const totalMyHearts = myPosts.reduce((sum, post) => sum + (post.hearts || 0), 0);
                
                // (*** MODIFIED ***) - 내 게시물의 댓글 수 총합 계산
                const totalMyComments = myPosts.reduce((sum, post) => sum + (post.comments || 0), 0);
                
                profileModalUserImg.src = photoURL; // (*** MODIFIED ***)
                profileModalUserId.textContent = displayName; // (*** MODIFIED ***)
                totalHearts.textContent = totalMyHearts;
                totalPosts.textContent = totalMyPosts;
                totalComments.textContent = totalMyComments; // (*** MODIFIED ***)
                profileModal.classList.remove('hidden');
            });
            closeProfileModalBtn.addEventListener('click', () => profileModal.classList.add('hidden'));
            
            postModal.addEventListener('click', (e) => { if (e.target === postModal) postModal.classList.add('hidden'); });
            profileModal.addEventListener('click', (e) => { if (e.target === profileModal) profileModal.classList.add('hidden'); });
            
            postImageInput.addEventListener('change', () => {
                imagePreview.textContent = postImageInput.files.length > 0 ? postImageInput.files[0].name : '';
            });

            postForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const currentUser = auth.currentUser;
                if (!currentUser) return;

                // (*** NEW ***) 익명 유저 처리
                const displayName = currentUser.displayName || `User-${currentUser.uid.substring(0, 6)}`;
                const photoURL = currentUser.photoURL || `https://placehold.co/40x40/E2E8F0/4A5568?text=${displayName[0]}`;

                const newPostData = {
                    subject: activeSubject === '전체' ? '기타' : activeSubject,
                    user: displayName, // (*** MODIFIED ***)
                    userImg: photoURL, // (*** MODIFIED ***)
                    userId: currentUser.uid,
                    title: document.getElementById('post-title').value,
                    content: document.getElementById('post-content').value,
                    image: null, // 실제 이미지 저장은 Firebase Storage 필요 (추후 구현)
                    hearts: 0,
                    comments: 0,
                    createdAt: serverTimestamp()
                };
                
                try {
                     // (*** MODIFIED ***) Firestore 경로 수정
                    await addDoc(collection(db, postsCollectionPath), newPostData);
                    postModal.classList.add('hidden');
                    postForm.reset();
                    imagePreview.textContent = '';
                } catch (error) {
                    console.error("게시물 추가 오류: ", error);
                    errorMessage.textContent = '게시물을 저장하는 데 실패했습니다.';
                    errorModal.classList.remove('hidden');
                }
            });

            // (*** NEW ***) 댓글 모달 이벤트 리스너
            closeCommentModalBtn.addEventListener('click', () => closeAndClearComments());
            commentModal.addEventListener('click', (e) => { if (e.target === commentModal) closeAndClearComments(); });
            commentForm.addEventListener('submit', handleCommentSubmit);


            // --- 글로벌 함수 ---
            window.toggleHeart = async (button, postId) => {
                if(!auth.currentUser) return;
                 // (*** MODIFIED ***) Firestore 경로 수정
                const postRef = doc(db, postsCollectionPath, postId);

                if (likedPosts.has(postId)) {
                    likedPosts.delete(postId); // 로컬 상태에서 제거
                    await updateDoc(postRef, { hearts: increment(-1) });
                } else {
                    likedPosts.add(postId); // 로컬 상태에 추가
                    await updateDoc(postRef, { hearts: increment(1) });
                }
                // renderPosts(); // 실시간 리스너(onSnapshot)가 자동 업데이트하므로 수동 render 호출은 불필요
            };

            // (*** NEW ***) 댓글 관련 글로벌 함수
            let unsubscribeComments = null; // 댓글 리스너 해제용

            window.openComments = async (postId) => {
                if (!auth.currentUser) return;

                commentPostIdInput.value = postId;
                commentModal.classList.remove('hidden');

                // 기존 리스너가 있다면 해제
                if (unsubscribeComments) {
                    unsubscribeComments();
                }

                // 새 리스너 설정: (*** MODIFIED ***) Firestore 경로 수정
                const commentsQuery = query(collection(db, postsCollectionPath, postId, "comments"), orderBy("createdAt", "asc"));
                unsubscribeComments = onSnapshot(commentsQuery, (snapshot) => {
                    commentList.innerHTML = ''; // 목록 비우기
                    if (snapshot.empty) {
                        commentList.innerHTML = `<p class="text-center text-gray-500 p-4">첫 댓글을 작성해보세요.</p>`;
                        return;
                    }
                    snapshot.forEach(doc => {
                        const comment = doc.data();
                        const commentEl = document.createElement('div');
                        commentEl.className = 'flex items-start space-x-3';
                        
                        // 타임스탬프 포맷팅
                        const timestamp = comment.createdAt?.toDate().toLocaleString('ko-KR', { 
                            timeZone: 'Asia/Seoul', 
                            year: 'numeric', 
                            month: '2-digit', 
                            day: '2-digit', 
                            hour: '2-digit', 
                            minute: '2-digit',
                            hour12: false
                        }) || '방금 전';
                        
                        commentEl.innerHTML = `
                            <img src="${comment.userImg}" alt="user" class="w-8 h-8 rounded-full mt-1">
                            <div class="flex-1 bg-gray-100 p-3 rounded-lg">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="font-bold text-sm text-gray-800">${comment.user}</span>
                                    <span class="text-xs text-gray-500">${timestamp}</span>
                                </div>
                                <p class="text-sm text-gray-700 whitespace-pre-wrap">${comment.text}</p>
                            </div>
                        `;
                        commentList.appendChild(commentEl);
                    });
                    // 새 댓글 추가 시 스크롤 맨 아래로
                    commentList.scrollTop = commentList.scrollHeight;
                }, (error) => {
                    console.error("댓글 로딩 오류:", error);
                    errorMessage.textContent = '댓글을 불러오는 데 실패했습니다.';
                    errorModal.classList.remove('hidden');
                });
            };

            // (*** NEW ***) 댓글 모달 닫기 (리스너 해제 포함)
            function closeAndClearComments() {
                if (unsubscribeComments) {
                    unsubscribeComments(); // 리스너 해제 (중요!)
                    unsubscribeComments = null;
                }
                commentModal.classList.add('hidden');
                commentList.innerHTML = '';
                commentForm.reset();
            }

            // (*** NEW ***) 댓글 제출 핸들러
            async function handleCommentSubmit(e) {
                e.preventDefault();
                const currentUser = auth.currentUser;
                const postId = commentPostIdInput.value;
                const commentText = commentInput.value.trim();

                if (!currentUser || !postId || commentText === '') return;

                // (*** NEW ***) 익명 유저 처리
                const displayName = currentUser.displayName || `User-${currentUser.uid.substring(0, 6)}`;
                const photoURL = currentUser.photoURL || `https://placehold.co/40x40/E2E8F0/4A5568?text=${displayName[0]}`;

                // 1. 새 댓글 데이터
                const newCommentData = {
                    text: commentText,
                    user: displayName, // (*** MODIFIED ***)
                    userImg: photoURL, // (*** MODIFIED ***)
                    userId: currentUser.uid,
                    createdAt: serverTimestamp()
                };
                
                // 2. 원본 게시물 문서 참조 (*** MODIFIED ***)
                const postRef = doc(db, postsCollectionPath, postId);

                try {
                    // 1. 'comments' 서브컬렉션에 새 댓글 추가 (*** MODIFIED ***)
                    await addDoc(collection(db, postsCollectionPath, postId, "comments"), newCommentData);
                    
                    // 2. 'posts' 문서의 'comments' 카운트 1 증가
                    await updateDoc(postRef, { comments: increment(1) });
                    
                    // 폼 리셋
                    commentForm.reset();
                } catch (error) {
                    console.error("댓글 작성 오류:", error);
                    errorMessage.textContent = '댓글을 작성하는 데 실패했습니다.';
                    errorModal.classList.remove('hidden');
                }
            }


            // --- (*** MODIFIED ***) 인증 상태 변경 감지 및 데이터 동기화 ---
            let unsubscribePosts = null; 
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUserId = user.uid;
                    initializeAppUI(user);

                    // Firestore 실시간 리스너 설정 (*** MODIFIED ***)
                    const postsQuery = query(collection(db, postsCollectionPath), orderBy("createdAt", "desc"));
                    unsubscribePosts = onSnapshot(postsQuery, (snapshot) => {
                        posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        renderPosts();
                    }, (error) => {
                        console.error("데이터 가져오기 오류:", error);
                        errorMessage.textContent = '데이터를 불러오는 데 실패했습니다.';
                        errorModal.classList.remove('hidden');
                    });

                } else {
                    currentUserId = null;
                    // (*** MODIFIED ***) 로그아웃 시 앱 컨테이너 숨기지 않고, 에러 메시지 표시
                    errorMessage.textContent = '로그아웃되었습니다. 다시 로그인하려면 새로고침하세요.';
                    errorModal.classList.remove('hidden');
                    
                    // 로그아웃 시 리스너 해제 및 로컬 데이터 초기화
                    if (unsubscribePosts) {
                        unsubscribePosts();
                    }
                    closeAndClearComments(); // (*** MODIFIED ***) - 댓글 모달도 닫기
                    posts = [];
                    likedPosts.clear();
                    activeSubject = '전체';
                }
            });

            // --- (*** NEW ***) 앱 시작 시 자동 인증 ---
            authenticateUser();

        });
    </script>
</body>
</html>
